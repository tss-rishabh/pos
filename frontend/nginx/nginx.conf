worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/null crit;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  keepalive_timeout 65;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  map $upstream_http_x_request_id $trace_request_id { default $upstream_http_x_request_id; '' $request_id; }
  map $status $trace_outcome { ~^[45] failed; default completed; }
  log_format resource_event escape=json '{"module":"gateway","resource":"http-request","eventId":"gateway.http-request.handle.$trace_outcome","eventInstanceId":"$request_id","requestId":"$trace_request_id","userId":null,"method":"$request_method","status":$status,"durationSeconds":$request_time}';
  access_log /dev/stdout resource_event;
  include /tmp/nginxconf/*.conf;
}
