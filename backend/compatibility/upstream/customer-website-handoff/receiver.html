<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="referrer" content="no-referrer"><title>Customer website sign-in</title></head>
<body><main><h1>Customer website sign-in</h1><p id="status" role="status">Preparing secure sign-in…</p><button id="retry" type="button" hidden>Retry sign-in</button></main>
<script nonce="__NONCE__">
(() => {
  'use strict';
  const token = location.hash.slice(1);
  // Clear the capability before any request, UI callback, analytics or external resource.
  history.replaceState(null, '', '/pos/secure-login');
  const csrf = '__CSRF__', operationId = '__OPERATION__';
  const status = document.getElementById('status'), retry = document.getElementById('retry');
  let busy = false;
  async function consume() {
    if (busy || !/^[A-Za-z0-9_-]{43}$/.test(token)) {status.textContent='This sign-in link is unavailable. Request a new link in the store.';return;}
    busy=true;retry.hidden=true;
    try {
      const response=await fetch('/pos/secure-login',{
        method:'POST',credentials:'same-origin',cache:'no-store',redirect:'error',referrerPolicy:'no-referrer',
        headers:{'Content-Type':'application/json','Accept':'application/json'},
        body:JSON.stringify({token,operationId,_token:csrf}),signal:AbortSignal.timeout(12000),
      });
      const result=await response.json();
      if(!response.ok || result.status!=='signed-in' || Object.keys(result).join(',')!=='status')throw new Error('Unavailable');
      location.replace('/');
    }catch(_error){status.textContent='Could not sign in. Retry this link before it expires, or request a new link in the store.';retry.hidden=false;}
    finally{busy=false;}
  }
  retry.addEventListener('click',()=>void consume());void consume();
})();
</script></body></html>
